name: Build Flet App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Flet
        run: pip install "flet[all]"
      - name: Build Windows app
        run: flet build windows --yes -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev mpv
      - name: Install Flet
        run: pip install "flet[all]"
      - name: Build Linux app
        run: flet build linux --yes -v
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flet
        run: pip install "flet[all]"
      - name: Build Android APK
        run: flet build apk --yes -v
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Flet
        run: pip install "flet[all]"
      - name: Build iOS IPA
        run: flet build ipa --yes -v
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ipa
          if-no-files-found: error